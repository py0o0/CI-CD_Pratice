name: docker, ci/cd, ec2, hub

on:
  push:
    branch:
      - dev

jobs:
  docker-cicd:
    runs-on: ubuntu-latest
    steps:
      # 소스코드 체크아웃
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      # jdk 17 설치
      - name: jdk 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 필요 시 현재 환경 수시 확인 가능
      - name: 현재 상황 체크
        run: |
          pwd
          ls
      # 환경변수 동적 세팅 X (여기서는 제외)
      # 빌드, 단위 테스트 ->  편의상 개발자 pc에서 선행수행
      # 도커 관련 액션
      - name: 도커 작업을 진행하기 위한 액션 적용
        uses: docker/setup-buildx-action@v3

      # 도커 허브 로그인 -> 계정 정보 (닉네임, 도커 허브 토큰) -> 시크릿 변수
      # 도커 허브 토큰 -> 프로필 -> 어카운트 세팅 -> 퍼스널 액세스 토큰 -> 발급 -> read, write, delete 로 생성
      - name: 도커 허브 로그인
        run: echo "${{ secrets.HUB_DOCKER_TOKEN }}" | docker login -u "${{ HUB_DOCKER_NAME }}" --password-stdin

      # 백엔드 이미지 생성 -> 허브(레파지토리) 푸쉬
      - name: 백엔드 이미지 생성 -> 허브(레파지토리) 푸쉬
        run: |
          docker build -t py0o0/demo_backend ./backend
          docker push py0o0/demo_backend

      # 프론트 이미지 생성 -> 허브(레파지토리) 푸쉬
      - name: 프론트 이미지 생성 -> 허브(레파지토리) 푸쉬
        run: |
          docker build -t py0o0/demo_frontend ./frontend
          docker push py0o0/demo_frontend

      # ec2 서버로 필요 파일 업로드(YML, nginx/*.conf)

  #deploy:
      # 도커 컴포즈 진행
